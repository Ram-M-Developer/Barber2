<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — BarberEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-wrapper">

  <div class="auth-card">
    <div class="text-center mb-4">
      <a href="/" class="brand-logo justify-content-center text-decoration-none">
        <i class="fa-solid fa-scissors"></i> BARBER<span class="text-danger">EASE</span>
      </a>
      <p class="text-muted mt-2">Sign in to your account to book your chair</p>
    </div>

    <!-- Alert Message Container -->
    <div id="alert-container"></div>

    <form onsubmit="handleLogin(event)">
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-dark-subtle border-secondary text-white-50"><i class="fa-solid fa-envelope"></i></span>
          <input type="email" class="form-control border-secondary text-white" id="email" required placeholder="name@example.com">
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between">
          <label for="password" class="form-label">Password</label>
          <a href="#" onclick="showForgotPasswordAlert()" class="text-danger text-decoration-none small">Forgot Password?</a>
        </div>
        <div class="input-group">
          <span class="input-group-text bg-dark-subtle border-secondary text-white-50"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control border-secondary text-white" id="password" required placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="btn btn-danger w-100 py-2.5 fw-bold mt-2">
        <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
      </button>
    </form>

    <div class="text-center mt-4 pt-2 border-top border-secondary">
      <p class="text-muted mb-0">Don't have an account? <a href="/auth/register.html" class="text-danger text-decoration-none fw-bold">Register here</a></p>
      <p class="text-muted mt-2 mb-0"><a href="/auth/admin-login.html" class="text-secondary text-decoration-none small"><i class="fa-solid fa-user-shield me-1"></i>Admin Portal Login</a></p>
    </div>
  </div>

  <!-- Common Client Script -->
  <script src="/js/auth.js"></script>
</body>
</html>
