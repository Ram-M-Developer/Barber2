<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — BarberEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color: var(--be-dark);">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/customer/dashboard.html">
        <i class="fa-solid fa-scissors text-danger me-2"></i>BarberEase
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#custNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="custNav">
        <ul class="navbar-nav ms-auto align-items-center gap-2">
          <li class="nav-item"><a class="nav-link" href="/customer/dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="/customer/profile.html">My Profile</a></li>
          <li class="nav-item">
            <button class="btn btn-outline-danger btn-sm" onclick="handleLogout()">
              <i class="fa-solid fa-right-from-bracket me-1"></i>Logout
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container" style="margin-top: 100px; margin-bottom: 50px;">
    
    <div class="row mb-4">
      <div class="col-12">
        <h2 class="fw-bold"><i class="fa-solid fa-user-gear text-danger me-2"></i>My Profile Settings</h2>
        <p class="text-muted">Manage your personal information, phone number, and security preferences.</p>
      </div>
    </div>

    <!-- Alert Container -->
    <div id="alert-container"></div>

    <div class="row g-4">
      <!-- Profile Info Card -->
      <div class="col-md-6">
        <div class="card card-dark shadow-sm">
          <div class="card-header">
            <h5 class="mb-0 fw-bold"><i class="fa-solid fa-id-card text-danger me-2"></i>Personal Details</h5>
          </div>
          <div class="card-body">
            <form onsubmit="handleUpdateProfile(event)">
              <div class="mb-3">
                <label for="profile-name" class="form-label">Full Name</label>
                <input type="text" class="form-control bg-dark border-secondary text-white" id="profile-name" required>
              </div>

              <div class="mb-3">
                <label for="profile-email" class="form-label">Email Address (Read Only)</label>
                <input type="email" class="form-control bg-dark border-secondary text-white-50" id="profile-email" readonly>
              </div>

              <div class="mb-3">
                <label for="profile-phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control bg-dark border-secondary text-white" id="profile-phone" required>
              </div>

              <div class="mb-3">
                <label for="profile-gender" class="form-label">Gender</label>
                <select class="form-select bg-dark border-secondary text-white" id="profile-gender">
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                  <option value="other">Other</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="profile-address" class="form-label">Address</label>
                <textarea class="form-control bg-dark border-secondary text-white" id="profile-address" rows="2"></textarea>
              </div>

              <button type="submit" class="btn btn-danger w-100 py-2.5 fw-bold">
                <i class="fa-solid fa-floppy-disk me-2"></i>Save Profil Change
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Security / Change Password -->
      <div class="col-md-6">
        <div class="card card-dark shadow-sm">
          <div class="card-header">
            <h5 class="mb-0 fw-bold"><i class="fa-solid fa-shield-halved text-danger me-2"></i>Security Preferences</h5>
          </div>
          <div class="card-body">
            <form onsubmit="handleChangePassword(event)">
              <div class="mb-3">
                <label for="current-password" class="form-label">Current Password</label>
                <input type="password" class="form-control bg-dark border-secondary text-white" id="current-password" required placeholder="••••••••">
              </div>

              <div class="mb-3">
                <label for="new-password" class="form-label">New Password</label>
                <input type="password" class="form-control bg-dark border-secondary text-white" id="new-password" required placeholder="••••••••">
              </div>

              <div class="mb-3">
                <label for="confirm-password" class="form-label">Confirm New Password</label>
                <input type="password" class="form-control bg-dark border-secondary text-white" id="confirm-password" required placeholder="••••••••">
              </div>

              <button type="submit" class="btn btn-outline-danger w-100 py-2.5 fw-bold">
                <i class="fa-solid fa-key me-2"></i>Update Password
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/profile.js"></script>
  <script>
    checkAuth('customer');
  </script>
</body>
</html>
