<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — BarberEase</title>
  <meta name="description" content="Sign in to BarberEase to manage your barber appointments, check your queue position, and reserve seats.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-visual {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }
    .login-feature-pill {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 0.9rem;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--be-border);
      font-size: 0.82rem;
      animation: slideInRight 0.4s ease both;
    }
    .login-feature-pill:nth-child(2) { animation-delay: 0.08s; }
    .login-feature-pill:nth-child(3) { animation-delay: 0.16s; }
    .login-feature-pill .pill-icon {
      width: 30px; height: 30px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .divider-or {
      position: relative;
      text-align: center;
      margin: 1rem 0;
    }
    .divider-or::before {
      content: '';
      position: absolute;
      top: 50%; left: 0; right: 0;
      height: 1px;
      background: var(--be-border);
    }
    .divider-or span {
      position: relative;
      background: var(--be-card);
      padding: 0 0.75rem;
      font-size: 0.75rem;
      color: var(--be-muted);
    }
    .remember-me-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }
    .toggle-switch {
      width: 36px; height: 20px;
      background: var(--be-border);
      border-radius: 10px;
      position: relative;
      transition: background 0.3s;
      cursor: pointer;
      flex-shrink: 0;
    }
    .toggle-switch.on { background: var(--be-primary); }
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.3s;
    }
    .toggle-switch.on::after { transform: translateX(16px); }
  </style>
</head><body class="auth-wrapper" style="background-color: var(--be-dark);">

  <div class="auth-card fb-feed-card" style="border-radius: 8px;">

    <!-- Brand -->
    <div class="text-center mb-4">
      <div class="d-flex justify-content-center mb-2">
        <div class="fb-logo-icon" style="width:48px;height:48px;font-size:1.5rem">
          <i class="fa-solid fa-scissors"></i>
        </div>
      </div>
      <h3 class="fw-bold text-dark mb-0">BarberEase</h3>
      <p class="text-muted small">Log in to book chair slots and track your live queue position</p>
    </div>

    <!-- Feature Pills -->
    <div class="login-visual mb-3">
      <div class="login-feature-pill" style="background:#f8fafc;border-radius:6px">
        <div class="pill-icon" style="background:rgba(37,99,235,0.1);border:1px solid rgba(37,99,235,0.2)">
          <i class="fa-solid fa-chair text-primary"></i>
        </div>
        <span class="text-dark" style="font-size:0.8rem">2 Main Service Chairs &amp; Dedicated Waiting Lounges</span>
      </div>
      <div class="login-feature-pill" style="background:#f8fafc;border-radius:6px">
        <div class="pill-icon" style="background:rgba(37,99,235,0.1);border:1px solid rgba(37,99,235,0.2)">
          <i class="fa-solid fa-ticket text-primary"></i>
        </div>
        <span class="text-dark" style="font-size:0.8rem">Chair-first time slots &amp; live token tracking</span>
      </div>
    </div>

    <!-- Alert Container -->
    <div id="alert-container"></div>

    <form onsubmit="handleLogin(event)" id="login-form" novalidate>

      <div class="mb-3">
        <label for="email" class="form-label small text-muted">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
          <input type="email" class="form-control" id="email" required
            placeholder="name@example.com" autocomplete="email">
        </div>
      </div>

      <div class="mb-2">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="password" class="form-label small text-muted mb-0">Password</label>
          <a href="#" onclick="showForgotPasswordAlert()" class="text-decoration-none" style="font-size:0.8rem;color:var(--be-primary)">
            <i class="fa-solid fa-key me-1"></i>Forgot password?
          </a>
        </div>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control" id="password" required
            placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="input-group-text border-0"
            style="cursor:pointer;background:#f8fafc;border:1px solid var(--be-border)!important"
            onclick="togglePassword()">
            <i class="fa-solid fa-eye text-muted" id="pwd-eye-icon"></i>
          </button>
        </div>
      </div>

      <!-- Remember Me -->
      <div class="d-flex justify-content-between align-items-center mb-4 mt-3">
        <label class="remember-me-toggle" for="remember-toggle" onclick="toggleRemember()">
          <div class="toggle-switch" id="remember-toggle"></div>
          <span class="text-muted small">Keep me signed in</span>
        </label>
        <span class="ws-indicator" id="ws-status-login">
          <span class="ws-dot"></span>
          <span>Ready</span>
        </span>
      </div>

      <button type="submit" class="fb-btn-primary w-100 py-2 fs-6" id="login-btn">
        <i class="fa-solid fa-right-to-bracket me-2"></i>Log In
      </button>
    </form>

    <div class="divider-or"><span>or</span></div>

    <!-- Demo shortcut -->
    <button class="fb-btn-secondary w-100 py-2" onclick="fillDemo()">
      <i class="fa-solid fa-flask me-2" style="color:var(--be-primary)"></i>Log In as Demo Customer
    </button>

    <div class="text-center mt-4 pt-3 border-top" style="border-color:var(--be-border)!important">
      <p class="text-muted small mb-1">Don't have an account?
        <a href="/auth/register.html" class="text-decoration-none fw-bold" style="color:var(--be-primary)">Create new account</a>
      </p>
      <p class="mb-0">
        <a href="/auth/admin-login.html" class="text-secondary text-decoration-none" style="font-size:0.78rem">
          <i class="fa-solid fa-user-shield me-1"></i>Admin Portal
        </a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    let rememberMe = false;

    function toggleRemember() {
      rememberMe = !rememberMe;
      const toggle = document.getElementById('remember-toggle');
      toggle.classList.toggle('on', rememberMe);
    }

    function togglePassword() {
      const field = document.getElementById('password');
      const icon = document.getElementById('pwd-eye-icon');
      if (field.type === 'password') {
        field.type = 'text';
        icon.className = 'fa-solid fa-eye-slash text-muted';
      } else {
        field.type = 'password';
        icon.className = 'fa-solid fa-eye text-muted';
      }
    }

    function fillDemo() {
      document.getElementById('email').value = 'demo@barberease.com';
      document.getElementById('password').value = 'Demo1234!';
      document.getElementById('alert-container').innerHTML =
        '<div class="alert alert-info py-2 small"><i class="fa-solid fa-circle-info me-1"></i>Demo credentials filled. Click Sign In to continue.</div>';
    }

    // Simulate WS status indicator
    setTimeout(() => {
      const wsStatus = document.getElementById('ws-status-login');
      if (wsStatus) {
        wsStatus.innerHTML = '<span class="ws-dot connected"></span><span>Server online</span>';
      }
    }, 1200);

    // Override login to handle remember me
    const _origLogin = handleLogin;
    window.handleLogin = async function(event) {
      event.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span>';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Login failed. Please check credentials.');

        const store = rememberMe ? localStorage : sessionStorage;
        store.setItem('barber_token', data.data.token);
        store.setItem('barber_user', JSON.stringify(data.data.customer));
        store.setItem('barber_user_type', 'customer');
        // Always set in localStorage for auth check compatibility
        if (!rememberMe) {
          localStorage.setItem('barber_token', data.data.token);
          localStorage.setItem('barber_user', JSON.stringify(data.data.customer));
          localStorage.setItem('barber_user_type', 'customer');
        }

        btn.innerHTML = '<i class="fa-solid fa-check me-2"></i>Signed In!';
        btn.className = 'btn btn-primary w-100 py-2 fw-bold';

        setTimeout(() => { window.location.href = '/customer/dashboard.html'; }, 900);
      } catch (error) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i>Sign In to BarberEase';
        const ac = document.getElementById('alert-container');
        ac.innerHTML = `<div class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
          <i class="fa-solid fa-triangle-exclamation me-1"></i>${error.message}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
      }
    };
  </script>
</body>
</html>
