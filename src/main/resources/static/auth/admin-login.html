<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — BarberEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-wrapper">

  <div class="auth-card">
    <div class="text-center mb-4">
      <a href="/" class="brand-logo justify-content-center text-decoration-none">
        <i class="fa-solid fa-user-shield" style="color:var(--be-primary)"></i> ADMIN<span style="color:#ffffff">PORTAL</span>
      </a>
      <p class="text-muted mt-2 small">Sign in with administrator credentials</p>
    </div>

    <!-- Alert Message Container -->
    <div id="alert-container"></div>

    <form onsubmit="handleAdminLogin(event)">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-dark-subtle border-secondary text-white-50"><i class="fa-solid fa-user"></i></span>
          <input type="text" class="form-control border-secondary text-white" id="username" required placeholder="admin">
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-dark-subtle border-secondary text-white-50"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control border-secondary text-white" id="password" required placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-2">
        <i class="fa-solid fa-lock-open me-2"></i>Access Dashboard
      </button>
    </form>

    <div class="text-center mt-4 pt-2 border-top border-secondary">
      <p class="text-muted mb-0"><a href="/auth/login.html" class="text-secondary text-decoration-none small"><i class="fa-solid fa-chevron-left me-1"></i>Back to Customer Login</a></p>
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
