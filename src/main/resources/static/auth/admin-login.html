<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — BarberEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-auth-card {
      background: #ffffff;
      border: 1px solid var(--be-border);
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--be-shadow-lg);
    }
    .admin-auth-card .form-control {
      background-color: #ffffff !important;
      color: #0f172a !important;
      border: 1px solid #cbd5e1 !important;
      font-size: 0.95rem;
    }
    .admin-auth-card .form-control:focus {
      border-color: var(--be-primary) !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2) !important;
    }
    .admin-auth-card .input-group-text {
      background-color: #f8fafc !important;
      border: 1px solid #cbd5e1 !important;
      color: #64748b !important;
    }
  </style>
</head>
<body class="auth-wrapper" style="background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);">

  <div class="admin-auth-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle mb-3" style="background: rgba(37, 99, 235, 0.1);">
        <i class="fa-solid fa-user-shield fs-2" style="color:var(--be-primary)"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">Admin Portal</h3>
      <p class="text-muted small">Sign in with system administrator credentials</p>
      
      <div class="alert alert-info py-2 px-3 small text-start d-flex align-items-center gap-2 mb-0 mt-2">
        <i class="fa-solid fa-key text-primary"></i>
        <span>Default: <strong>admin</strong> / <strong>admin123</strong></span>
      </div>
    </div>

    <!-- Alert Message Container -->
    <div id="alert-container"></div>

    <form onsubmit="handleAdminLogin(event)">
      <div class="mb-3">
        <label for="username" class="form-label fw-semibold small text-muted">Administrator Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
          <input type="text" class="form-control" id="username" required placeholder="admin" autocomplete="username">
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-semibold small text-muted">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control" id="password" required placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="input-group-text" onclick="togglePasswordVisibility()" title="Toggle password view">
            <i class="fa-solid fa-eye" id="pwd-eye-icon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" style="border-radius: 8px;">
        <i class="fa-solid fa-lock-open me-2"></i>Access Admin Dashboard
      </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top border-secondary-subtle">
      <p class="text-muted mb-0">
        <a href="/auth/login.html" class="text-secondary text-decoration-none small fw-semibold">
          <i class="fa-solid fa-chevron-left me-1"></i>Back to Customer Login
        </a>
      </p>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('pwd-eye-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }
  </script>
</body>
</html>
