<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — BarberEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-wrapper">

  <div class="auth-card" style="max-width: 500px;">
    <div class="text-center mb-4">
      <a href="/" class="brand-logo justify-content-center text-decoration-none">
        <i class="fa-solid fa-scissors"></i> BARBER<span class="text-danger">EASE</span>
      </a>
      <p class="text-muted mt-2">Create an account to book and check queue positions</p>
    </div>

    <!-- Alert Message Container -->
    <div id="alert-container"></div>

    <form onsubmit="handleRegister(event)">
      <div class="row">
        <div class="col-md-12 mb-3">
          <label for="name" class="form-label">Full Name</label>
          <div class="input-group">
            <span class="input-group-text bg-dark-subtle border-secondary text-white-50"><i class="fa-solid fa-user"></i></span>
            <input type="text" class="form-control border-secondary text-white" id="name" required placeholder="John Doe">
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-dark-subtle border-secondary text-white-50"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" class="form-control border-secondary text-white" id="email" required placeholder="name@example.com">
          </div>
        </div>
        <div class="col-md-6 mb-3">
          <label for="phone" class="form-label">Phone Number</label>
          <div class="input-group">
            <span class="input-group-text bg-dark-subtle border-secondary text-white-50"><i class="fa-solid fa-phone"></i></span>
            <input type="tel" class="form-control border-secondary text-white" id="phone" required placeholder="555-1234">
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="gender" class="form-label">Gender (Optional)</label>
          <select class="form-select bg-dark-subtle border-secondary text-white" id="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-dark-subtle border-secondary text-white-50"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control border-secondary text-white" id="password" required placeholder="••••••••">
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label for="address" class="form-label">Address (Optional)</label>
        <textarea class="form-control bg-dark-subtle border-secondary text-white" id="address" rows="2" placeholder="Your street address"></textarea>
      </div>

      <button type="submit" class="btn btn-danger w-100 py-2.5 fw-bold mt-2">
        <i class="fa-solid fa-user-plus me-2"></i>Create Account
      </button>
    </form>

    <div class="text-center mt-4 pt-2 border-top border-secondary">
      <p class="text-muted mb-0">Already have an account? <a href="/auth/login.html" class="text-danger text-decoration-none fw-bold">Sign In</a></p>
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
